kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

# ASP.NET Core 8 API (artifacts/api-server). The Repl needs the .NET 8 SDK (e.g. the dotnet-8.0 module).

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
ASPNETCORE_ENVIRONMENT = "Production"

[services.production.run]
# Runs the published output directly (dotnet publish → artifacts/api-server/dist).
args = ["dotnet", "artifacts/api-server/dist/AssetIQ.Api.dll"]

[services.production.run.env]
PORT = "8080"
ASPNETCORE_ENVIRONMENT = "Production"

[services.production.health.startup]
path = "/api/healthz"
