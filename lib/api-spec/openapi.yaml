        assetId:
          type: integer
        assetName:
          type: string
        rfidTag:
          type: string
        eventType:
          type: string
          enum: [deployment, return_to_it, repair_sent, repair_returned, sbu_transfer, note]
        performedBy:
          type: string
        fromSbuId:
          type: ["integer", "null"]
        fromSbuName:
          type: ["string", "null"]
        toSbuId:
          type: ["integer", "null"]
        toSbuName:
          type: ["string", "null"]
        assignedTo:
          type: ["string", "null"]
        vendor:
          type: ["string", "null"]
        ticketRef:
          type: ["string", "null"]
        conditionBefore:
          type: ["string", "null"]
        conditionAfter:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        timestamp:
          type: string
          format: date-time

    AssetLifecycleEventInput:
      type: object
      required: [eventType, performedBy]
      properties:
        eventType:
          type: string
          enum: [deployment, return_to_it, repair_sent, repair_returned, sbu_transfer, note]
        performedBy:
          type: string
        fromSbuId:
          type: integer
        toSbuId:
          type: integer
        assignedTo:
          type: string
        custodianEmployeeId:
          type: integer
