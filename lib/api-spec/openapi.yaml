        - $ref: "#/components/parameters/ReportTo"
        - name: assetId
          in: query
          schema:
            type: integer
        - name: sbuId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: CSV file (Content-Disposition attachment)
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Invalid date range
        "401":
          description: Not signed in

