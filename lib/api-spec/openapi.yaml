            enum: [pending_asset_number, in_store, in_use, out_on_gate_pass, repair_requested, in_repair, transfer_pending, pending_disposal, lost_stolen, disposed]
        - name: locationId
          in: query
          schema:
            type: integer
        - name: sbuId
          in: query
          schema:
            type: integer
        - name: category
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: CSV file (Content-Disposition attachment)
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Not signed in

