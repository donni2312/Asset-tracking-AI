        name:
          type: string
        isIt:
          type: boolean
        subCategories:
          type: array
          items:
            type: string
        descriptionPattern:
          type: string
        identifierFieldKey:
          type: ["string", "null"]
        depreciationMethod:
          type: string
          enum: [straight_line, reducing_balance]
        usefulLifeMonths:
          type: ["integer", "null"]
        annualRate:
          type: ["number", "null"]
        defaultResidualPercent:
          type: number
          description: Residual value proposed at capitalisation, as a % of cost (0 by default)
        active:
          type: boolean
        fields:
          type: array
          items:
            $ref: "#/components/schemas/TemplateField"

    CategoryInput:
      type: object
      required: [code, name, isIt, depreciationMethod]
      properties:
        code:
          type: string
        name:
          type: string
        isIt:
          type: boolean
        subCategories:
          type: array
          items:
            type: string
        descriptionPattern:
          type: string
        identifierFieldKey:
          type: string
        depreciationMethod:
          type: string
          enum: [straight_line, reducing_balance]
        usefulLifeMonths:
          type: integer
        annualRate:
          type: number

    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
        subCategories:
          type: array
          items:
            type: string
        depreciationMethod:
          type: string
          enum: [straight_line, reducing_balance]
        usefulLifeMonths:
          type: ["integer", "null"]
        annualRate:
          type: ["number", "null"]
        defaultResidualPercent:
          type: number
        active:
          type: boolean
        descriptionPattern:
          type: string
        identifierFieldKey:
          type: ["string", "null"]
        reason:
          type: string

    TemplateFieldInput:
      type: object
      required: [key, label, type, required]
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [text, number, integer, date, list]
        unit:
          type: string
        required:
          type: boolean
        allowedValues:
          type: array
          items:
            type: string
        sortOrder:
          type: integer

    TemplateFieldUpdate:
      type: object
      properties:
        label:
          type: string
        required:
          type: boolean
        unit:
          type: ["string", "null"]
        allowedValues:
          type: array
          items:
            type: string
        sortOrder:
          type: integer

    GroupSetting:
      type: object
      required: [key, value, description, editableBy, updatedAt]
      properties:
        key:
          type: string
        value:
          description: The setting's JSON value (number, string, list or object)
        description:
          type: string
        editableBy:
          type: string
          enum: [group_finance, group_it]
        updatedBy:
          type: ["string", "null"]
        updatedAt:
          type: string
          format: date-time

    SettingUpdate:
      type: object
      required: [value]
      properties:
        value:
          description: The new value; the same kind of JSON value as before
        reason:
          type: string

    AssetLookup:
      type: object
      required: [assetId]
      properties:
        assetId:
          type: integer

    AssetAttribute:
      type: object
      required: [key, label, value]
      properties:
        key:
          type: string
        label:
