        vendor:
          type: string
        ticketRef:
          type: string
        conditionBefore:
          type: string
        conditionAfter:
          type: string
        notes:
          type: string

    # ── Combined history event (movements + lifecycle) ───────────────────────
    AssetHistoryEvent:
      type: object
      required: [id, kind, timestamp]
      properties:
        id:
          type: string
          description: Prefixed identifier e.g. mov-12 or lc-7
        kind:
          type: string
          enum: [movement, lifecycle]
        timestamp:
          type: string
          format: date-time
        # movement fields
        fromLocationName:
          type: ["string", "null"]
        toLocationName:
          type: ["string", "null"]
        triggeredBy:
          type: ["string", "null"]
          enum: [rfid, manual, gate_pass, null]
        movedBy:
          type: ["string", "null"]
        gatePassId:
          type: ["integer", "null"]
        # lifecycle fields
        eventType:
          type: ["string", "null"]
          enum: [deployment, return_to_it, repair_sent, repair_returned, sbu_transfer, note, null]
        performedBy:
          type: ["string", "null"]
        fromSbuName:
          type: ["string", "null"]
        toSbuName:
          type: ["string", "null"]
        assignedTo:
          type: ["string", "null"]
        vendor:
          type: ["string", "null"]
        ticketRef:
          type: ["string", "null"]
        conditionBefore:
          type: ["string", "null"]
        conditionAfter:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    # ── Location schemas ─────────────────────────────────────────────────────
    Location:
      type: object
      required: [id, name, type, building, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [office, gate, warehouse, meeting_room, lab, reception, server_room]
        building:
          type: string
        floor:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        sbuId:
          type: ["integer", "null"]
        sbuName:
          type: ["string", "null"]
        sbuCode:
          type: ["string", "null"]
        assetCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    LocationInput:
      type: object
      required: [name, type, building]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [office, gate, warehouse, meeting_room, lab, reception, server_room]
        building:
          type: string
        floor:
          type: string
        description:
          type: string
        sbuId:
          type: integer

    LocationUpdate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [office, gate, warehouse, meeting_room, lab, reception, server_room]
        building:
          type: string
        floor:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        sbuId:
          type: ["integer", "null"]

    # ── Movement schemas ─────────────────────────────────────────────────────
    MovementEvent:
      type: object
      required: [id, assetId, assetName, triggeredBy, timestamp]
      properties:
        id:
          type: integer
        assetId:
          type: integer
        assetName:
          type: string
        rfidTag:
          type: string
        fromLocationId:
          type: ["integer", "null"]
        fromLocationName:
          type: ["string", "null"]
        toLocationId:
          type: ["integer", "null"]
        toLocationName:
          type: ["string", "null"]
        sbuId:
          type: ["integer", "null"]
        sbuName:
          type: ["string", "null"]
        triggeredBy:
          type: string
          enum: [rfid, manual, gate_pass]
        rfidReaderId:
          type: ["integer", "null"]
        gatePassId:
          type: ["integer", "null"]
          description: Gate pass that authorised (or was raised by) this movement
        movedBy:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        timestamp:
          type: string
          format: date-time

    MovementInput:
      type: object
      required: [assetId, toLocationId]
      properties:
        assetId:
          type: integer
        toLocationId:
          type: integer
        movedBy:
          type: string
        notes:
          type: string

    # ── Gate Pass schemas ────────────────────────────────────────────────────
    GatePass:
      type: object
      required: [id, assetId, assetName, requestedBy, status, reason, createdAt]
      properties:
        id:
          type: integer
        assetId:
          type: integer
        assetName:
          type: string
        rfidTag:
          type: string
        sbuId:
          type: ["integer", "null"]
        sbuName:
          type: ["string", "null"]
        requestedBy:
          type: string
        approvedBy:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        reason:
          type: string
        destination:
          type: ["string", "null"]
        returnDate:
          type: ["string", "null"]
          format: date
        decisionNote:
          type: ["string", "null"]
        source:
          type: string
          enum: [manual, rfid_gate]
          description: manual = requested in advance; rfid_gate = raised automatically by a gate reader
        gateLocationId:
          type: ["integer", "null"]
        gateLocationName:
          type: ["string", "null"]
        decidedAt:
          type: ["string", "null"]
          format: date-time
        exitedAt:
          type: ["string", "null"]
          format: date-time
          description: When the asset left the premises under this pass (latest gate_pass movement); null = not used yet
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          description: Phase 4c - the items of the pass and each one's exit / return
          items:
            $ref: "#/components/schemas/GatePassItem"

    GatePassInput:
      type: object
      required: [assetId, requestedBy, reason]
      properties:
        assetId:
          type: integer
        requestedBy:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        destination:
          type: string
        returnDate:
          type: string
          format: date
        itemAssetIds:
          type: array
          description: Phase 4c - further items leaving under the same pass (same SBU)
          items:
            type: integer

    GatePassDecision:
      type: object
      properties:
        decidedBy:
          type: string
          description: Ignored since Phase 2 - the signed-in approver is recorded
        note:
          type: string

    # ── RFID schemas ─────────────────────────────────────────────────────────
    RFIDSimulateInput:
      type: object
      required: [rfidTag, readerId]
      properties:
        rfidTag:
          type: string
        readerId:
          type: integer
        scannedAt:
          type: string
          format: date-time
          description: Time the reader saw the tag (defaults to now). Lets the simulator replay out-of-hours scans.

    GateCheck:
      type: object
      required: [isGate, direction, outcome, authorized]
      properties:
        isGate:
          type: boolean
        direction:
          type: string
          enum: [entry, exit, internal]
          description: exit = asset was on the premises; entry = asset was off-premises (returning)
        outcome:
          type: string
          enum: [not_gate, entry, authorized, pending_created, pending_existing]
        authorized:
          type: boolean
        gatePass:
          $ref: "#/components/schemas/GatePass"

    RFIDScanResult:
      type: object
      required: [movement, gateCheck, insights]
      properties:
        movement:
          $ref: "#/components/schemas/MovementEvent"
        gateCheck:
          $ref: "#/components/schemas/GateCheck"
        insights:
          type: array
          description: Insights raised by this scan
          items:
            $ref: "#/components/schemas/AIInsight"

    RFIDReader:
      type: object
      required: [id, name, locationId, locationName, status]
      properties:
        id:
          type: integer
        name:
          type: string
        locationId:
          type: integer
        locationName:
          type: string
        sbuId:
          type: ["integer", "null"]
        sbuCode:
          type: ["string", "null"]
        sbuName:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        lastReadAt:
          type: ["string", "null"]
          format: date-time

    # ── Dashboard schemas ─────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalAssets, activeAssets, missingAssets, maintenanceAssets, pendingGatePasses, todayMovements, totalLocations, unacknowledgedInsights, sbuBreakdown]
      properties:
