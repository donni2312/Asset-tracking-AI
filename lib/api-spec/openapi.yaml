        - name: locationId
          in: query
          schema:
            type: integer
        - name: sbuId
          in: query
          schema:
            type: integer
        - name: category
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: CSV file (Content-Disposition attachment)
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Not signed in

