openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.5.0
  description: TSL AssetIQ — Intelligent Asset Management & Tracking System for TSL Limited, Zimbabwe
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sbus
    description: Strategic Business Unit management
  - name: assets
    description: Asset registry management
  - name: locations
    description: Location management
  - name: movements
    description: Asset movement events
  - name: lifecycle
    description: Asset lifecycle events (deployments, repairs, returns, transfers)
  - name: gate-passes
    description: Gate pass requests and approvals
  - name: rfid
    description: RFID reader registry and simulation
  - name: dashboard
    description: Dashboard summaries
  - name: insights
    description: AI-generated insights and anomaly detection
  - name: bc
    description: Business Central integration
  - name: auth
    description: Authentication and roles
  - name: reports
    description: CSV report downloads
  - name: categories
    description: Category templates and depreciation policy (AU-01, GI-02, AM-01, GF-03)
  - name: settings
    description: Group settings
  - name: asset-card
    description: Asset card, lookup, audit trail and exports (AU-06, AU-08)
  - name: asset-record
    description: Financial fields, capitalisation, category changes, "No serial" decisions, tagging (AU-02 … AU-04)
  - name: upgrades
    description: Upgrades and Finance's capitalise / expense decision (AU-07)
  - name: finance
    description: Register, category report, dashboard, completeness, approvals, depreciation runs (AU-05, AU-09 … AU-11)
  - name: users
    description: User accounts and roles (GI-08; Phase 2 permissions matrix)
  - name: people
    description: Departments and employees (Phase 2; HR toolbox stories build on them)
  - name: attachments
    description: Invoices, photos and documents on an asset (AU-01, AU-04, AU-07)
  - name: scan
    description: Tag / number scans at the gate or on the floor (SG-01, SI-03)

# Phase 2: every endpoint needs a signed-in user except the health check and sign-in. What each role may do is
# the Permissions matrix of docs/user-stories.md, enforced by the API (403 otherwise); lists and exports hold
# only the caller's scope (SBU, IT / non-IT, department, own items).
security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Authentication ───────────────────────────────────────────────────────────
  /auth/login:
    post:
      security: []
      operationId: login
      tags: [auth]
      summary: Sign in and receive a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Unknown user, wrong password, or the account is disabled

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: The signed-in user behind the bearer token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing, expired or invalid token

  # ── SBUs ─────────────────────────────────────────────────────────────────────
  /sbus:
    get:
      operationId: listSbus
      tags: [sbus]
      summary: List all Strategic Business Units
      responses:
        "200":
          description: List of SBUs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SBU"
    post:
      operationId: createSbu
      tags: [sbus]
      summary: Create an SBU
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SBUInput"
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in, but the role (or its SBU / IT scope) may not do this
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SBU"

  /sbus/{id}:
    get:
      operationId: getSbu
      tags: [sbus]
      summary: Get an SBU
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: SBU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SBU"
        "404":
          description: Not found
    patch:
      operationId: updateSbu
      tags: [sbus]
      summary: Update an SBU
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SBUInput"
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in, but the role (or its SBU / IT scope) may not do this
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SBU"

  /sbus/{id}/assets:
    get:
      operationId: getSbuAssets
      tags: [sbus]
      summary: Get all assets belonging to an SBU
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"

  # ── Assets ──────────────────────────────────────────────────────────────────
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List all assets
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_asset_number, active, maintenance, retired, missing]
        - name: locationId
          in: query
          schema:
            type: ["integer", "null"]
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
        - name: category
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: Search query (name, serial, RFID tag)
          schema:
            type: string
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Register a new asset from its category template (AU-01 … AU-03)
      description: >-
        There is no generic form: the category's template decides the fields. The API rejects a missing
        category, a missing required field or a field of another category (400), a serial / MAC used anywhere
        in the Group (409, naming the asset that has it; the attempt is logged), and a role that may not
        register this kind of asset (403: IT assets by Group IT, SBU IT or Stores of the SBU; non-IT assets by
        that SBU's Admin Manager or its Stores at receipt). The description is generated
        and the Business Central asset number is requested; until it is issued the status is
        pending_asset_number.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          description: Not signed in
        "403":
          description: The signed-in user may not register assets

  /assets/{id}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get asset details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Not found
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update the asset's technical fields
      description: >-
        Template values are merged with the current ones, re-validated and the description rebuilt; every
        change is audit-logged. The description (name) and the category cannot be set here (400): the
        category changes through POST /assets/{id}/category (SBU Finance only).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          description: Not signed in
        "403":
          description: The signed-in user may not make this change
        "404":
          description: Not found
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Delete a mistaken registration
      description: >-
        Needs edit rights on the asset. An asset with a Business Central asset
        number can never be deleted (409), so its number is never reused; nor can one with history.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Not signed in
        "403":
          description: The signed-in user may not delete assets

  /assets/{id}/history:
    get:
      operationId: getAssetHistory
      tags: [assets]
      summary: Full chronological history of an asset (movements + lifecycle events)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Full history timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetHistoryEvent"

  /assets/{id}/lifecycle:
    get:
      operationId: listAssetLifecycleEvents
      tags: [lifecycle]
      summary: List lifecycle events for an asset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lifecycle events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetLifecycleEvent"
    post:
      operationId: createAssetLifecycleEvent
      tags: [lifecycle]
      summary: Record a lifecycle event for an asset
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetLifecycleEventInput"
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in, but the role (or its SBU / IT scope) may not do this
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetLifecycleEvent"

  # ── Lifecycle (all events) ────────────────────────────────────────────────
  /lifecycle:
    get:
      operationId: listLifecycleEvents
      tags: [lifecycle]
      summary: List all lifecycle events (across all assets)
      parameters:
        - name: eventType
          in: query
          schema:
            type: string
            enum: [deployment, return_to_it, repair_sent, repair_returned, sbu_transfer, note]
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Lifecycle events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetLifecycleEvent"

  # ── Locations ───────────────────────────────────────────────────────────────
  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: List all locations
      parameters:
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
        - name: type
          in: query
          schema:
            type: string
            enum: [office, gate, warehouse, meeting_room, lab, reception, server_room]
      responses:
        "200":
          description: List of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
    post:
      operationId: createLocation
      tags: [locations]
      summary: Create a location
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in, but the role (or its SBU / IT scope) may not do this
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"

  /locations/{id}:
    get:
      operationId: getLocation
      tags: [locations]
      summary: Get a location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
    patch:
      operationId: updateLocation
      tags: [locations]
      summary: Update a location
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in, but the role (or its SBU / IT scope) may not do this
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"

  /locations/{id}/assets:
    get:
      operationId: getLocationAssets
      tags: [locations]
      summary: Get assets currently at a location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assets at location
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"

  # ── Movements ────────────────────────────────────────────────────────────────
  /movements:
    get:
      operationId: listMovements
      tags: [movements]
      summary: List movement events
      parameters:
        - name: assetId
          in: query
          schema:
            type: ["integer", "null"]
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Movement events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MovementEvent"
    post:
      operationId: createMovement
      tags: [movements]
      summary: Record a manual movement event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovementInput"
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in, but the role (or its SBU / IT scope) may not do this
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementEvent"
        "400":
          description: Invalid input (e.g. asset is already at that location)
        "404":
          description: Asset or destination location not found

  /movements/{id}:
    get:
      operationId: getMovement
      tags: [movements]
      summary: Get a movement event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Movement event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementEvent"

  # ── Gate Passes ──────────────────────────────────────────────────────────────
  /gate-passes:
    get:
      operationId: listGatePasses
      tags: [gate-passes]
      summary: List gate pass requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Gate passes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GatePass"
    post:
      operationId: createGatePass
      tags: [gate-passes]
      summary: Submit a gate pass request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatePassInput"
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in, but the role (or its SBU / IT scope) may not do this
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatePass"
        "400":
          description: Invalid input (e.g. return date in the past)
        "404":
          description: Asset not found
        "409":
          description: The asset already has a pending gate pass

  /gate-passes/{id}:
    get:
      operationId: getGatePass
      tags: [gate-passes]
      summary: Get a gate pass
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Gate pass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatePass"

  /gate-passes/{id}/approve:
    post:
      operationId: approveGatePass
      tags: [gate-passes]
      summary: Approve a gate pass
      security:
        - bearerAuth: []
      description: Approving records a `gate_pass` movement (the asset leaves the premises) and resolves the related unauthorised-movement alert.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatePassDecision"
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in, but the role (or its SBU / IT scope) may not do this
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatePass"
        "404":
          description: Gate pass not found
        "409":
          description: Gate pass has already been decided

  /gate-passes/{id}/reject:
    post:
      operationId: rejectGatePass
      tags: [gate-passes]
      summary: Reject a gate pass
      security:
        - bearerAuth: []
      description: Rejecting flags the asset (unauthorised-movement alert plus an audit note in the asset history).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatePassDecision"
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in, but the role (or its SBU / IT scope) may not do this
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatePass"
        "404":
          description: Gate pass not found
        "409":
          description: Gate pass has already been decided

  # ── RFID Simulation ──────────────────────────────────────────────────────────
  /rfid/simulate:
    post:
      operationId: simulateRfidRead
      tags: [rfid]
      summary: Simulate an RFID tag read event at a gate or office reader
      security:
        - bearerAuth: []
      description: |
        Processes a tag read exactly like a hardware event would be processed:
        records an `rfid` movement, runs the gate-pass check for gate readers
        (an exit without an approved pass auto-creates a pending gate pass) and
        evaluates the anomaly rules (unauthorised exit, SBU location mismatch,
        out-of-hours scan).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RFIDSimulateInput"
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in, but the role (or its SBU / IT scope) may not do this
        "200":
          description: Scan result (movement, gate check outcome and any insights raised)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFIDScanResult"
        "404":
          description: Unknown RFID tag or reader
        "409":
          description: Reader is inactive

  /rfid/readers:
    get:
      operationId: listRfidReaders
      tags: [rfid]
      summary: List all RFID readers (with SBU and location context)
      parameters:
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: RFID readers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RFIDReader"

  # ── Dashboard ─────────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary statistics (overall + per-SBU)
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/location-breakdown:
    get:
      operationId: getLocationBreakdown
      tags: [dashboard]
      summary: Asset counts grouped by location (optionally filtered by SBU)
      parameters:
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Location breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocationBreakdown"

  /dashboard/movement-trend:
    get:
      operationId: getMovementTrend
      tags: [dashboard]
      summary: Daily movement counts by trigger type for the last N days (organisation timezone)
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 14
      responses:
        "200":
          description: One point per day, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MovementTrendPoint"

  /dashboard/gate-activity:
    get:
      operationId: getGateActivity
      tags: [dashboard]
      summary: Recent gate scan events grouped by SBU gate
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Gate activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GateActivityItem"

  # ── AI Insights ───────────────────────────────────────────────────────────────
  /insights:
    get:
      operationId: listInsights
      tags: [insights]
      summary: List AI-generated insights and anomaly alerts
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AIInsight"

  /insights/{id}/dismiss:
    post:
      operationId: dismissInsight
      tags: [insights]
      summary: Dismiss an insight
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in, but the role (or its SBU / IT scope) may not do this
        "200":
          description: Dismissed
          content:
