    AssetStatus:
      type: string
      enum: [pending_asset_number, in_store, in_use, out_on_gate_pass, repair_requested, in_repair, transfer_pending, pending_disposal, lost_stolen, disposed]
      description: >-
        Phase 3 state machine (docs/implementation-plan.md §11.1); a change not in the table is refused with 409.
        pending_asset_number = waiting for the Business Central asset number (AU-03); disposed is final.

    AssetCondition:
      type: string
      enum: [new, good, fair, poor, damaged]

