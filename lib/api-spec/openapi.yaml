          type: boolean
        nextService:
          oneOf:
            - $ref: "#/components/schemas/ServiceDue"
            - type: "null"
        canEdit:
          type: boolean
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceLog"

    FleetUpdateInput:
      type: object
      properties:
        fleetStatus:
          type: string
          enum: [active, in_service, off_road]
        driverEmployeeId:
          type: ["integer", "null"]
        driverName:
          type: ["string", "null"]
        reading:
          type: integer

    VehicleDocumentInput:
      type: object
      required: [kind, expiresOn]
      properties:
        kind:
          type: string
          enum: [licence, insurance, fitness, zinara]
        reference:
          type: string
        expiresOn:
          type: string
          format: date

    ServiceScheduleInput:
      type: object
      properties:
        intervalReading:
          type: integer
        intervalDays:
          type: integer
        startDate:
          type: string
          format: date
        startReading:
          type: integer

    ServiceLogInput:
      type: object
      required: [serviceDate, garage, workDone]
      properties:
        serviceDate:
          type: string
          format: date
        reading:
          type: integer
        garage:
          type: string
        workDone:
          type: string

    ServiceCostInput:
      type: object
      required: [cost]
      properties:
        cost:
          type: number
        currency:
          type: string

    ImportUpload:
      type: object
      required: [file]
      description: multipart/form-data with a .csv or .xlsx file (up to 10 MB); described as a string so the generated libraries need no browser types.
      properties:
        file:
          type: string

    ImportRow:
      type: object
      required: [row, errors]
      properties:
        row:
          type: integer
        description:
          type: ["string", "null"]
        errors:
          type: array
          items:
            type: string

    ImportReport:
      type: object
      required: [rowCount, errorRowCount, canImport, imported, assetIds, rows]
      properties:
        rowCount:
          type: integer
        errorRowCount:
          type: integer
        canImport:
          type: boolean
        imported:
          type: integer
        assetIds:
          type: array
          items:
            type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportRow"

    ItInventoryRow:
      type: object
      required: [assetId, description, status, refreshReasons]
      properties:
        assetId:
          type: integer
        assetNumber:
          type: ["string", "null"]
        description:
          type: string
        subCategory:
          type: ["string", "null"]
        make:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        serialNumber:
          type: ["string", "null"]
        rfidTag:
          type: ["string", "null"]
        sbuCode:
          type: ["string", "null"]
        site:
          type: ["string", "null"]
        assignedTo:
          type: ["string", "null"]
        status:
          type: string
        condition:
          type: ["string", "null"]
        lastSeen:
          type: ["string", "null"]
          format: date-time
        ageYears:
          type: ["number", "null"]
        warrantyEnds:
          type: ["string", "null"]
        refreshReasons:
          type: array
          items:
            type: string

    StatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer

    ItStatusBoard:
      type: object
      required: [counts, faulty, spare]
      properties:
        counts:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
        faulty:
          type: integer
        spare:
          type: array
          items:
            $ref: "#/components/schemas/ItInventoryRow"

