components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Period:
      name: period
      in: query
      description: Month (YYYY-MM); default the current month
      schema:
        type: string
    SbuFilter:
      name: sbuId
      in: query
      schema:
        type: integer
    LocationFilter:
      name: locationId
      in: query
      schema:
        type: integer
    CategoryFilter:
      name: categoryId
      in: query
      schema:
        type: integer
    ReportFrom:
      name: from
      in: query
      description: First calendar day (YYYY-MM-DD, organisation time zone), inclusive
      schema:
        type: string
        format: date
    ReportTo:
      name: to
      in: query
      description: Last calendar day (YYYY-MM-DD, organisation time zone), inclusive
      schema:
        type: string
        format: date

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token returned by POST /auth/login.

  schemas:
    # ── Auth schemas ─────────────────────────────────────────────────────────
    UserRole:
      type: string
      enum: [group_finance, group_it, sbu_it, sbu_finance, gate_officer, hod, sbu_hr, stores, sbu_admin, auditor, employee, system_admin]
      description: >-
        The roles of the docs/user-stories.md Permissions matrix (Phase 2) plus the auditor (read-only, every SBU,
        until its expiry date), the employee (their own items) and the system administrator (categories, final
        depreciation rates and Group settings only). SBU roles act on their own SBU only. The original viewer /
        operator / admin roles were retired by migration 0004.

    User:
      type: object
      required: [id, username, name, role, roleName, scope]
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
          description: Display name, recorded on approvals and movements
        role:
          $ref: "#/components/schemas/UserRole"
        roleName:
          type: string
          description: Display name of the role, as on the sidebar
        sbuId:
          type: ["integer", "null"]
        sbuCode:
          type: ["string", "null"]
        scope:
          type: string
          description: The data scope shown under the role ("All SBUs", "BAK Logistics (IT assets)")
        employeeId:
          type: ["integer", "null"]
        employeeName:
          type: ["string", "null"]
        departmentId:
          type: ["integer", "null"]
        departmentName:
          type: ["string", "null"]
        accessExpiresAt:
          type: ["string", "null"]
          format: date-time
        lastLoginAt:
          type: ["string", "null"]
          format: date-time

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    LoginResult:
      type: object
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
          description: Bearer token for the Authorization header
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── SBU schemas ──────────────────────────────────────────────────────────
    SBU:
      type: object
      required: [id, code, name, color, createdAt]
      properties:
        id:
          type: integer
        code:
          type: string
          description: Short code e.g. TSAS, BAK, AGRI, PROP, TSF
        name:
          type: string
          description: Full SBU name
        description:
          type: ["string", "null"]
        headOffice:
          type: ["string", "null"]
        color:
          type: string
          description: Hex colour for UI badges
        assetCount:
          type: integer
        locationCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    SBUInput:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        headOffice:
          type: string
        color:
          type: string

    # ── Asset schemas ────────────────────────────────────────────────────────
    Asset:
      type: object
      required: [id, name, category, categoryId, categoryName, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
          description: The description, generated from the category template (AU-01)
        category:
          type: string
          description: The sub-category (Laptop, Desktop, Printer, Light vehicle …)
        categoryId:
          type: integer
        categoryName:
          type: string
        subCategory:
          type: ["string", "null"]
        serialNumber:
          type: ["string", "null"]
          description: Group-unique identifier (serial, VIN or IMEI); null when recorded as "No serial"
        noSerialReason:
          type: ["string", "null"]
        noSerialStatus:
          type: ["string", "null"]
          enum: [pending, approved, rejected, null]
        macAddress:
          type: ["string", "null"]
        rfidTag:
          type: ["string", "null"]
          description: Null until tagged (only after the asset number is issued)
        assetNumber:
          type: ["string", "null"]
          description: Business Central fixed-asset number; null while pending (AU-03). Never changes once issued.
        previousAssetNumber:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/AssetStatus"
        condition:
          type: ["string", "null"]
        assignedTo:
          type: ["string", "null"]
          description: The custodian
        currentLocationId:
          type: ["integer", "null"]
        currentLocationName:
          type: ["string", "null"]
        sbuId:
          type: ["integer", "null"]
        sbuName:
          type: ["string", "null"]
        sbuCode:
          type: ["string", "null"]
        purchaseDate:
          type: ["string", "null"]
          format: date
        purchaseValue:
          type: ["number", "null"]
          description: Legacy USD value (kept equal to the original cost)
        originalCost:
          type: ["number", "null"]
          description: In the purchase currency
        currency:
          type: ["string", "null"]
        exchangeRate:
          type: ["number", "null"]
        costUsd:
          type: ["number", "null"]
          description: originalCost × exchangeRate, fixed at capitalisation
        capitalisedAt:
          type: ["string", "null"]
          format: date-time
        capitalisedBy:
          type: ["string", "null"]
        residualValue:
          type: ["number", "null"]
          description: Null, like every cost and value field, for roles without financial access
        supplier:
          type: ["string", "null"]
        invoiceNo:
          type: ["string", "null"]
        poNo:
          type: ["string", "null"]
        inUseDate:
          type: ["string", "null"]
          format: date
        costCentre:
          type: ["string", "null"]
          description: SF-01 (Phase 4d)
        warrantyEnds:
          type: ["string", "null"]
          format: date
        disposalDate:
          type: ["string", "null"]
          format: date
        lostDate:
          type: ["string", "null"]
          format: date
        lostReportedBy:
          type: ["string", "null"]
        lostNotes:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AssetInput:
      type: object
      required: [categoryId, currentLocationId, assignedTo, condition]
      properties:
        categoryId:
          type: integer
        subCategory:
          type: string
        attributes:
          $ref: "#/components/schemas/TemplateValues"
        noSerialReason:
          type: string
          description: Required when the item has no manufacturer serial; SBU Finance approves it
        sbuId:
          type: integer
          description: Default the SBU of an SBU role; required for Group roles
        currentLocationId:
          type: integer
        assignedTo:
          type: string
          description: The custodian
        condition:
          $ref: "#/components/schemas/AssetCondition"
        previousAssetNumber:
          type: string
        supplier:
          type: string
        poNo:
          type: string
        purchaseDate:
          type: string
          format: date
        warrantyEnds:
          type: string
          format: date
        notes:
          type: string

    AssetUpdate:
      type: object
      properties:
        subCategory:
          type: string
        attributes:
          $ref: "#/components/schemas/TemplateValues"
        noSerialReason:
          type: string
        status:
          type: string
          enum: [in_store, in_use, out_on_gate_pass, repair_requested, in_repair, transfer_pending, pending_disposal, lost_stolen, disposed]
          description: Through the state machine (409 when not allowed); lost_stolen needs POST /assets/{id}/status (GI-07)
        condition:
          $ref: "#/components/schemas/AssetCondition"
        assignedTo:
          type: ["string", "null"]
        currentLocationId:
          type: ["integer", "null"]
        sbuId:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        warrantyEnds:
          type: ["string", "null"]
          format: date
        custodianEmployeeId:
          type: ["integer", "null"]
          description: The employee holding the asset (sets the holder's name and department); null clears it
        departmentId:
          type: ["integer", "null"]
          description: The department holding the asset (LM-01)
        reason:
          type: string
          description: Saved with the audit entries

