            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleInfo"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: User accounts (Group IT - all; SBU IT - its own SBU; GI-08)
      parameters:
        - $ref: "#/components/parameters/SbuFilter"
        - name: role
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAccount"
    post:
      operationId: createUser
      tags: [users]
      summary: Create an account (Group IT any role but auditor; SBU IT - SBU roles of its own SBU)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAccountInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Change role, SBU, employee link, name, access or password (audit-logged; nobody changes their own role)
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAccountUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"

  /departments:
    get:
      operationId: listDepartments
      tags: [people]
      summary: Departments the caller may see (Group roles all; SBU roles their SBU; the HOD theirs)
      parameters:
        - $ref: "#/components/parameters/SbuFilter"
      responses:
        "200":
          description: Departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [people]
      summary: Add a department to the caller's SBU (SBU HR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

  /employees:
    get:
      operationId: listEmployees
      tags: [people]
      summary: Employees the caller may see (Group roles all; the HOD their department; SBU roles their SBU)
      parameters:
        - $ref: "#/components/parameters/SbuFilter"
        - name: departmentId
          in: query
          schema:
            type: integer
        - name: q
          in: query
          schema:
            type: string
        - name: includeLeavers
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [people]
      summary: Add an employee to the caller's SBU (SBU HR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [people]
      summary: One employee (403 outside the caller's scope)
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: The employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    patch:
      operationId: updateEmployee
      tags: [people]
      summary: Change an employee of the caller's SBU (SBU HR; audit-logged)
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /assets/{id}/attachments:
    get:
      operationId: listAssetAttachments
      tags: [attachments]
      summary: Invoices, photos and documents on the asset, newest first
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Attachments (without their content)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attachment"
    post:
      operationId: uploadAssetAttachment
      tags: [attachments]
      summary: Attach a PDF, JPEG or PNG (up to 10 MB). Attachments are never deleted.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AttachmentUpload"
      responses:
        "201":
          description: Attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"

  /attachments/{id}:
    get:
      operationId: downloadAttachment
      tags: [attachments]
      summary: The file; every download is recorded in the access log
      description: Add ?inline=true to display the file (photo, PDF preview) instead of downloading it.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: The file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary

  /scan:
    get:
      operationId: scanCode
      tags: [scan]
      summary: Look up a scanned tag, asset number or serial (the Gate Officer's only view of an asset)
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Basic identification, plus holder and gate pass when the asset is the caller's to see
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Period:
      name: period
      in: query
      description: Month (YYYY-MM); default the current month
      schema:
        type: string
    SbuFilter:
      name: sbuId
      in: query
      schema:
        type: integer
    LocationFilter:
      name: locationId
      in: query
      schema:
        type: integer
    CategoryFilter:
      name: categoryId
      in: query
      schema:
        type: integer
    ReportFrom:
      name: from
      in: query
      description: First calendar day (YYYY-MM-DD, organisation time zone), inclusive
      schema:
        type: string
        format: date
    ReportTo:
      name: to
      in: query
      description: Last calendar day (YYYY-MM-DD, organisation time zone), inclusive
      schema:
        type: string
        format: date

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token returned by POST /auth/login.

  schemas:
    # ── Auth schemas ─────────────────────────────────────────────────────────
    UserRole:
      type: string
      enum: [group_finance, group_it, sbu_it, sbu_finance, gate_officer, hod, sbu_hr, stores, sbu_admin, auditor, employee, system_admin]
      description: >-
        The roles of the docs/user-stories.md Permissions matrix (Phase 2) plus the auditor (read-only, every SBU,
        until its expiry date), the employee (their own items) and the system administrator (categories, final
        depreciation rates and Group settings only). SBU roles act on their own SBU only. The original viewer /
        operator / admin roles were retired by migration 0004.

    User:
      type: object
      required: [id, username, name, role, roleName, scope]
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
          description: Display name, recorded on approvals and movements
        role:
          $ref: "#/components/schemas/UserRole"
        roleName:
          type: string
          description: Display name of the role, as on the sidebar
        sbuId:
          type: ["integer", "null"]
        sbuCode:
          type: ["string", "null"]
        scope:
          type: string
          description: The data scope shown under the role ("All SBUs", "BAK Logistics (IT assets)")
        employeeId:
          type: ["integer", "null"]
        employeeName:
          type: ["string", "null"]
        departmentId:
          type: ["integer", "null"]
        departmentName:
          type: ["string", "null"]
        accessExpiresAt:
          type: ["string", "null"]
          format: date-time
        lastLoginAt:
          type: ["string", "null"]
          format: date-time

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    LoginResult:
      type: object
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
          description: Bearer token for the Authorization header
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── SBU schemas ──────────────────────────────────────────────────────────
    SBU:
      type: object
      required: [id, code, name, color, createdAt]
      properties:
        id:
          type: integer
        code:
          type: string
          description: Short code e.g. TSAS, BAK, AGRI, PROP, TSF
        name:
          type: string
          description: Full SBU name
        description:
          type: ["string", "null"]
        headOffice:
          type: ["string", "null"]
        color:
          type: string
          description: Hex colour for UI badges
        assetCount:
          type: integer
        locationCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    SBUInput:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        headOffice:
          type: string
        color:
          type: string

    # ── Asset schemas ────────────────────────────────────────────────────────
    Asset:
      type: object
      required: [id, name, category, categoryId, categoryName, status, residualValue, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
          description: The description, generated from the category template (AU-01)
        category:
          type: string
          description: The sub-category (Laptop, Desktop, Printer, Light vehicle …)
        categoryId:
          type: integer
        categoryName:
          type: string
        subCategory:
          type: ["string", "null"]
        serialNumber:
          type: ["string", "null"]
          description: Group-unique identifier (serial, VIN or IMEI); null when recorded as "No serial"
        noSerialReason:
          type: ["string", "null"]
        noSerialStatus:
          type: ["string", "null"]
          enum: [pending, approved, rejected, null]
        macAddress:
          type: ["string", "null"]
        rfidTag:
          type: ["string", "null"]
          description: Null until tagged (only after the asset number is issued)
        assetNumber:
          type: ["string", "null"]
          description: Business Central fixed-asset number; null while pending (AU-03). Never changes once issued.
        previousAssetNumber:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/AssetStatus"
        condition:
          type: ["string", "null"]
        assignedTo:
          type: ["string", "null"]
          description: The custodian
        currentLocationId:
          type: ["integer", "null"]
        currentLocationName:
          type: ["string", "null"]
        sbuId:
          type: ["integer", "null"]
        sbuName:
          type: ["string", "null"]
        sbuCode:
          type: ["string", "null"]
        purchaseDate:
          type: ["string", "null"]
          format: date
        purchaseValue:
          type: ["number", "null"]
          description: Legacy USD value (kept equal to the original cost)
        originalCost:
          type: ["number", "null"]
          description: In the purchase currency
        currency:
          type: ["string", "null"]
        exchangeRate:
          type: ["number", "null"]
        costUsd:
          type: ["number", "null"]
          description: originalCost × exchangeRate, fixed at capitalisation
        capitalisedAt:
          type: ["string", "null"]
          format: date-time
        capitalisedBy:
          type: ["string", "null"]
        residualValue:
          type: number
        supplier:
          type: ["string", "null"]
        invoiceNo:
          type: ["string", "null"]
        poNo:
          type: ["string", "null"]
        inUseDate:
          type: ["string", "null"]
          format: date
        warrantyEnds:
          type: ["string", "null"]
          format: date
        disposalDate:
          type: ["string", "null"]
          format: date
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AssetInput:
      type: object
      required: [categoryId, currentLocationId, assignedTo, condition]
      properties:
        categoryId:
          type: integer
        subCategory:
          type: string
        attributes:
          $ref: "#/components/schemas/TemplateValues"
        noSerialReason:
          type: string
          description: Required when the item has no manufacturer serial; SBU Finance approves it
        sbuId:
          type: integer
          description: Default the SBU of an SBU role; required for Group roles
        currentLocationId:
          type: integer
        assignedTo:
          type: string
          description: The custodian
        condition:
          $ref: "#/components/schemas/AssetCondition"
        previousAssetNumber:
          type: string
        supplier:
          type: string
        poNo:
          type: string
        purchaseDate:
          type: string
          format: date
        warrantyEnds:
          type: string
          format: date
        notes:
          type: string

    AssetUpdate:
      type: object
      properties:
        subCategory:
          type: string
        attributes:
          $ref: "#/components/schemas/TemplateValues"
        noSerialReason:
          type: string
        status:
          type: string
          enum: [active, maintenance, retired, missing]
        condition:
          $ref: "#/components/schemas/AssetCondition"
        assignedTo:
          type: ["string", "null"]
        currentLocationId:
          type: ["integer", "null"]
        sbuId:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        warrantyEnds:
          type: ["string", "null"]
          format: date
        custodianEmployeeId:
          type: ["integer", "null"]
          description: The employee holding the asset (sets the holder's name and department); null clears it
        departmentId:
          type: ["integer", "null"]
          description: The department holding the asset (LM-01)
        reason:
          type: string
          description: Saved with the audit entries

    # ── Asset lifecycle schemas ───────────────────────────────────────────────
    AssetLifecycleEvent:
      type: object
      required: [id, assetId, assetName, eventType, performedBy, timestamp]
      properties:
        id:
          type: integer
        assetId:
          type: integer
        assetName:
          type: string
        rfidTag:
          type: string
        eventType:
          type: string
          enum: [deployment, return_to_it, repair_sent, repair_returned, sbu_transfer, note]
        performedBy:
          type: string
        fromSbuId:
          type: ["integer", "null"]
        fromSbuName:
          type: ["string", "null"]
        toSbuId:
          type: ["integer", "null"]
        toSbuName:
          type: ["string", "null"]
        assignedTo:
          type: ["string", "null"]
        vendor:
          type: ["string", "null"]
        ticketRef:
          type: ["string", "null"]
        conditionBefore:
          type: ["string", "null"]
        conditionAfter:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        timestamp:
          type: string
          format: date-time

    AssetLifecycleEventInput:
      type: object
      required: [eventType, performedBy]
      properties:
        eventType:
          type: string
          enum: [deployment, return_to_it, repair_sent, repair_returned, sbu_transfer, note]
        performedBy:
          type: string
        fromSbuId:
          type: integer
        toSbuId:
          type: integer
        assignedTo:
          type: string
        custodianEmployeeId:
          type: integer
          description: deployment - issue to this employee record (holder name and department follow)
        vendor:
          type: string
        ticketRef:
          type: string
        conditionBefore:
          type: string
        conditionAfter:
          type: string
        notes:
          type: string

    # ── Combined history event (movements + lifecycle) ───────────────────────
    AssetHistoryEvent:
      type: object
      required: [id, kind, timestamp]
      properties:
        id:
          type: string
          description: Prefixed identifier e.g. mov-12 or lc-7
        kind:
          type: string
          enum: [movement, lifecycle]
        timestamp:
          type: string
          format: date-time
        # movement fields
        fromLocationName:
          type: ["string", "null"]
        toLocationName:
          type: ["string", "null"]
        triggeredBy:
          type: ["string", "null"]
          enum: [rfid, manual, gate_pass, null]
        movedBy:
          type: ["string", "null"]
        gatePassId:
          type: ["integer", "null"]
        # lifecycle fields
        eventType:
          type: ["string", "null"]
          enum: [deployment, return_to_it, repair_sent, repair_returned, sbu_transfer, note, null]
        performedBy:
          type: ["string", "null"]
        fromSbuName:
          type: ["string", "null"]
        toSbuName:
          type: ["string", "null"]
        assignedTo:
          type: ["string", "null"]
        vendor:
          type: ["string", "null"]
        ticketRef:
          type: ["string", "null"]
        conditionBefore:
          type: ["string", "null"]
        conditionAfter:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    # ── Location schemas ─────────────────────────────────────────────────────
    Location:
      type: object
      required: [id, name, type, building, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [office, gate, warehouse, meeting_room, lab, reception, server_room]
        building:
          type: string
        floor:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        sbuId:
          type: ["integer", "null"]
        sbuName:
          type: ["string", "null"]
        sbuCode:
          type: ["string", "null"]
        assetCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    LocationInput:
      type: object
      required: [name, type, building]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [office, gate, warehouse, meeting_room, lab, reception, server_room]
        building:
          type: string
        floor:
          type: string
        description:
          type: string
        sbuId:
          type: integer

    LocationUpdate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [office, gate, warehouse, meeting_room, lab, reception, server_room]
        building:
          type: string
        floor:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        sbuId:
          type: ["integer", "null"]

    # ── Movement schemas ─────────────────────────────────────────────────────
    MovementEvent:
      type: object
      required: [id, assetId, assetName, triggeredBy, timestamp]
      properties:
        id:
          type: integer
        assetId:
          type: integer
        assetName:
          type: string
        rfidTag:
          type: string
        fromLocationId:
          type: ["integer", "null"]
        fromLocationName:
          type: ["string", "null"]
        toLocationId:
          type: ["integer", "null"]
        toLocationName:
          type: ["string", "null"]
        sbuId:
          type: ["integer", "null"]
        sbuName:
          type: ["string", "null"]
        triggeredBy:
          type: string
          enum: [rfid, manual, gate_pass]
        rfidReaderId:
          type: ["integer", "null"]
        gatePassId:
          type: ["integer", "null"]
          description: Gate pass that authorised (or was raised by) this movement
        movedBy:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        timestamp:
          type: string
          format: date-time

    MovementInput:
      type: object
      required: [assetId, toLocationId]
      properties:
        assetId:
          type: integer
        toLocationId:
          type: integer
        movedBy:
          type: string
        notes:
          type: string

    # ── Gate Pass schemas ────────────────────────────────────────────────────
    GatePass:
      type: object
      required: [id, assetId, assetName, requestedBy, status, reason, createdAt]
      properties:
        id:
          type: integer
        assetId:
          type: integer
        assetName:
          type: string
        rfidTag:
          type: string
        sbuId:
          type: ["integer", "null"]
        sbuName:
          type: ["string", "null"]
        requestedBy:
          type: string
        approvedBy:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        reason:
          type: string
        destination:
          type: ["string", "null"]
        returnDate:
          type: ["string", "null"]
          format: date
        decisionNote:
          type: ["string", "null"]
        source:
          type: string
          enum: [manual, rfid_gate]
          description: manual = requested in advance; rfid_gate = raised automatically by a gate reader
        gateLocationId:
          type: ["integer", "null"]
        gateLocationName:
          type: ["string", "null"]
        decidedAt:
          type: ["string", "null"]
          format: date-time
        exitedAt:
          type: ["string", "null"]
          format: date-time
          description: When the asset left the premises under this pass (latest gate_pass movement); null = not used yet
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GatePassInput:
      type: object
      required: [assetId, requestedBy, reason]
      properties:
        assetId:
          type: integer
        requestedBy:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        destination:
          type: string
        returnDate:
          type: string
          format: date

    GatePassDecision:
      type: object
      properties:
        decidedBy:
          type: string
          description: Ignored since Phase 2 - the signed-in approver is recorded
        note:
          type: string

    # ── RFID schemas ─────────────────────────────────────────────────────────
    RFIDSimulateInput:
      type: object
      required: [rfidTag, readerId]
      properties:
        rfidTag:
          type: string
        readerId:
          type: integer
        scannedAt:
          type: string
          format: date-time
          description: Time the reader saw the tag (defaults to now). Lets the simulator replay out-of-hours scans.

    GateCheck:
      type: object
      required: [isGate, direction, outcome, authorized]
      properties:
        isGate:
          type: boolean
        direction:
          type: string
          enum: [entry, exit, internal]
          description: exit = asset was on the premises; entry = asset was off-premises (returning)
        outcome:
          type: string
          enum: [not_gate, entry, authorized, pending_created, pending_existing]
        authorized:
          type: boolean
        gatePass:
          $ref: "#/components/schemas/GatePass"

    RFIDScanResult:
      type: object
      required: [movement, gateCheck, insights]
      properties:
        movement:
          $ref: "#/components/schemas/MovementEvent"
        gateCheck:
          $ref: "#/components/schemas/GateCheck"
        insights:
          type: array
          description: Insights raised by this scan
          items:
            $ref: "#/components/schemas/AIInsight"

    RFIDReader:
      type: object
      required: [id, name, locationId, locationName, status]
      properties:
        id:
          type: integer
        name:
          type: string
        locationId:
          type: integer
        locationName:
          type: string
        sbuId:
          type: ["integer", "null"]
        sbuCode:
          type: ["string", "null"]
        sbuName:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        lastReadAt:
          type: ["string", "null"]
          format: date-time

    # ── Dashboard schemas ─────────────────────────────────────────────────────
    DashboardSummary:
      type: object
