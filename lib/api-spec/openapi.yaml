openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: TSL AssetIQ — Intelligent Asset Management & Tracking System for TSL Limited, Zimbabwe
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sbus
    description: Strategic Business Unit management
  - name: assets
    description: Asset registry management
  - name: locations
    description: Location management
  - name: movements
    description: Asset movement events
  - name: lifecycle
    description: Asset lifecycle events (deployments, repairs, returns, transfers)
  - name: gate-passes
    description: Gate pass requests and approvals
  - name: rfid
    description: RFID reader registry and simulation
  - name: dashboard
    description: Dashboard summaries
  - name: insights
    description: AI-generated insights and anomaly detection
  - name: bc
    description: Business Central integration

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── SBUs ─────────────────────────────────────────────────────────────────────
  /sbus:
    get:
      operationId: listSbus
      tags: [sbus]
      summary: List all Strategic Business Units
      responses:
        "200":
          description: List of SBUs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SBU"
    post:
      operationId: createSbu
      tags: [sbus]
      summary: Create an SBU
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SBUInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SBU"

  /sbus/{id}:
    get:
      operationId: getSbu
      tags: [sbus]
      summary: Get an SBU
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: SBU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SBU"
        "404":
          description: Not found
    patch:
      operationId: updateSbu
      tags: [sbus]
      summary: Update an SBU
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SBUInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SBU"

  /sbus/{id}/assets:
    get:
      operationId: getSbuAssets
      tags: [sbus]
      summary: Get all assets belonging to an SBU
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"

  # ── Assets ──────────────────────────────────────────────────────────────────
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List all assets
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, maintenance, retired, missing]
        - name: locationId
          in: query
          schema:
            type: ["integer", "null"]
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
        - name: category
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: Search query (name, serial, RFID tag)
          schema:
            type: string
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Register a new asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /assets/{id}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get asset details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Not found
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update asset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Retire/decommission asset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /assets/{id}/history:
    get:
      operationId: getAssetHistory
      tags: [assets]
      summary: Full chronological history of an asset (movements + lifecycle events)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Full history timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetHistoryEvent"

  /assets/{id}/lifecycle:
    get:
      operationId: listAssetLifecycleEvents
      tags: [lifecycle]
      summary: List lifecycle events for an asset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lifecycle events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetLifecycleEvent"
    post:
      operationId: createAssetLifecycleEvent
      tags: [lifecycle]
      summary: Record a lifecycle event for an asset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetLifecycleEventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetLifecycleEvent"

  # ── Lifecycle (all events) ────────────────────────────────────────────────
  /lifecycle:
    get:
      operationId: listLifecycleEvents
      tags: [lifecycle]
      summary: List all lifecycle events (across all assets)
      parameters:
        - name: eventType
          in: query
          schema:
            type: string
            enum: [deployment, return_to_it, repair_sent, repair_returned, sbu_transfer, note]
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Lifecycle events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetLifecycleEvent"

  # ── Locations ───────────────────────────────────────────────────────────────
  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: List all locations
      parameters:
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
        - name: type
          in: query
          schema:
            type: string
            enum: [office, gate, warehouse, meeting_room, lab, reception, server_room]
      responses:
        "200":
          description: List of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
    post:
      operationId: createLocation
      tags: [locations]
      summary: Create a location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"

  /locations/{id}:
    get:
      operationId: getLocation
      tags: [locations]
      summary: Get a location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
    patch:
      operationId: updateLocation
      tags: [locations]
      summary: Update a location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"

  /locations/{id}/assets:
    get:
      operationId: getLocationAssets
      tags: [locations]
      summary: Get assets currently at a location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assets at location
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"

  # ── Movements ────────────────────────────────────────────────────────────────
  /movements:
    get:
      operationId: listMovements
      tags: [movements]
      summary: List movement events
      parameters:
        - name: assetId
          in: query
          schema:
            type: ["integer", "null"]
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Movement events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MovementEvent"
    post:
      operationId: createMovement
      tags: [movements]
      summary: Record a manual movement event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementEvent"

  /movements/{id}:
    get:
      operationId: getMovement
      tags: [movements]
      summary: Get a movement event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Movement event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementEvent"

  # ── Gate Passes ──────────────────────────────────────────────────────────────
  /gate-passes:
    get:
      operationId: listGatePasses
      tags: [gate-passes]
      summary: List gate pass requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Gate passes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GatePass"
    post:
      operationId: createGatePass
      tags: [gate-passes]
      summary: Submit a gate pass request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatePassInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatePass"

  /gate-passes/{id}:
    get:
      operationId: getGatePass
      tags: [gate-passes]
      summary: Get a gate pass
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Gate pass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatePass"

  /gate-passes/{id}/approve:
    post:
      operationId: approveGatePass
      tags: [gate-passes]
      summary: Approve a gate pass
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatePassDecision"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatePass"

  /gate-passes/{id}/reject:
    post:
      operationId: rejectGatePass
      tags: [gate-passes]
      summary: Reject a gate pass
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatePassDecision"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatePass"

  # ── RFID Simulation ──────────────────────────────────────────────────────────
  /rfid/simulate:
    post:
      operationId: simulateRfidRead
      tags: [rfid]
      summary: Simulate an RFID tag read event at a gate or office reader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RFIDSimulateInput"
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementEvent"

  /rfid/readers:
    get:
      operationId: listRfidReaders
      tags: [rfid]
      summary: List all RFID readers (with SBU and location context)
      parameters:
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: RFID readers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RFIDReader"

  # ── Dashboard ─────────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary statistics (overall + per-SBU)
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/location-breakdown:
    get:
      operationId: getLocationBreakdown
      tags: [dashboard]
      summary: Asset counts grouped by location (optionally filtered by SBU)
      parameters:
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Location breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocationBreakdown"

  /dashboard/gate-activity:
    get:
      operationId: getGateActivity
      tags: [dashboard]
      summary: Recent gate scan events grouped by SBU gate
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Gate activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GateActivityItem"

  # ── AI Insights ───────────────────────────────────────────────────────────────
  /insights:
    get:
      operationId: listInsights
      tags: [insights]
      summary: List AI-generated insights and anomaly alerts
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AIInsight"

  /insights/{id}/dismiss:
    post:
      operationId: dismissInsight
      tags: [insights]
      summary: Dismiss an insight
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIInsight"

  /ai/query:
    post:
      operationId: aiQuery
      tags: [insights]
      summary: Natural language query about assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIQueryInput"
      responses:
        "200":
          description: Query result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIQueryResult"

  # ── Business Central ──────────────────────────────────────────────────────────
  /bc/sync-status:
    get:
      operationId: getBcSyncStatus
      tags: [bc]
      summary: Get Business Central sync status
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BCSyncStatus"

  /bc/sync:
    post:
      operationId: triggerBcSync
      tags: [bc]
      summary: Trigger a sync with Business Central
      responses:
        "200":
          description: Sync triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BCSyncStatus"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── SBU schemas ──────────────────────────────────────────────────────────
    SBU:
      type: object
      required: [id, code, name, color, createdAt]
      properties:
        id:
          type: integer
        code:
          type: string
          description: Short code e.g. TSAS, BAK, AGRI, PROP, TSF
        name:
          type: string
          description: Full SBU name
        description:
          type: ["string", "null"]
        headOffice:
          type: ["string", "null"]
        color:
          type: string
          description: Hex colour for UI badges
        assetCount:
          type: integer
        locationCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    SBUInput:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        headOffice:
          type: string
        color:
          type: string

    # ── Asset schemas ────────────────────────────────────────────────────────
    Asset:
      type: object
      required: [id, name, category, serialNumber, rfidTag, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
          description: Laptop | Desktop | Projector | Phone | Printer | Network Equipment | UPS | Furniture | Vehicle | Other
        serialNumber:
          type: string
        rfidTag:
          type: string
        status:
          type: string
          enum: [active, maintenance, retired, missing]
        assignedTo:
          type: ["string", "null"]
        currentLocationId:
          type: ["integer", "null"]
        currentLocationName:
          type: ["string", "null"]
        sbuId:
          type: ["integer", "null"]
        sbuName:
          type: ["string", "null"]
        sbuCode:
          type: ["string", "null"]
        purchaseDate:
          type: ["string", "null"]
          format: date
        purchaseValue:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AssetInput:
      type: object
      required: [name, category, serialNumber, rfidTag]
      properties:
        name:
          type: string
        category:
          type: string
        serialNumber:
          type: string
        rfidTag:
          type: string
        status:
          type: string
          enum: [active, maintenance, retired, missing]
          default: active
        assignedTo:
          type: string
        currentLocationId:
          type: integer
        sbuId:
          type: integer
        purchaseDate:
          type: string
          format: date
        purchaseValue:
          type: number
        notes:
          type: string

    AssetUpdate:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [active, maintenance, retired, missing]
        assignedTo:
          type: ["string", "null"]
        currentLocationId:
          type: ["integer", "null"]
        sbuId:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]

    # ── Asset lifecycle schemas ───────────────────────────────────────────────
    AssetLifecycleEvent:
      type: object
      required: [id, assetId, assetName, eventType, performedBy, timestamp]
      properties:
        id:
          type: integer
        assetId:
          type: integer
        assetName:
          type: string
        rfidTag:
          type: string
        eventType:
          type: string
          enum: [deployment, return_to_it, repair_sent, repair_returned, sbu_transfer, note]
        performedBy:
          type: string
        fromSbuId:
          type: ["integer", "null"]
        fromSbuName:
          type: ["string", "null"]
        toSbuId:
          type: ["integer", "null"]
        toSbuName:
          type: ["string", "null"]
        assignedTo:
          type: ["string", "null"]
        vendor:
          type: ["string", "null"]
        ticketRef:
          type: ["string", "null"]
        conditionBefore:
          type: ["string", "null"]
        conditionAfter:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        timestamp:
          type: string
          format: date-time

    AssetLifecycleEventInput:
      type: object
      required: [eventType, performedBy]
      properties:
        eventType:
          type: string
          enum: [deployment, return_to_it, repair_sent, repair_returned, sbu_transfer, note]
        performedBy:
          type: string
        fromSbuId:
          type: integer
        toSbuId:
          type: integer
        assignedTo:
          type: string
        vendor:
          type: string
        ticketRef:
          type: string
        conditionBefore:
          type: string
        conditionAfter:
          type: string
        notes:
          type: string

    # ── Combined history event (movements + lifecycle) ───────────────────────
    AssetHistoryEvent:
      type: object
      required: [id, kind, timestamp]
      properties:
        id:
          type: string
          description: Prefixed identifier e.g. mov-12 or lc-7
        kind:
          type: string
          enum: [movement, lifecycle]
        timestamp:
          type: string
          format: date-time
        # movement fields
        fromLocationName:
          type: ["string", "null"]
        toLocationName:
          type: ["string", "null"]
        triggeredBy:
          type: ["string", "null"]
          enum: [rfid, manual, gate_pass, null]
        movedBy:
          type: ["string", "null"]
        # lifecycle fields
        eventType:
          type: ["string", "null"]
          enum: [deployment, return_to_it, repair_sent, repair_returned, sbu_transfer, note, null]
        performedBy:
          type: ["string", "null"]
        fromSbuName:
          type: ["string", "null"]
        toSbuName:
          type: ["string", "null"]
        assignedTo:
          type: ["string", "null"]
        vendor:
          type: ["string", "null"]
        ticketRef:
          type: ["string", "null"]
        conditionBefore:
          type: ["string", "null"]
        conditionAfter:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    # ── Location schemas ─────────────────────────────────────────────────────
    Location:
      type: object
      required: [id, name, type, building, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [office, gate, warehouse, meeting_room, lab, reception, server_room]
        building:
          type: string
        floor:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        sbuId:
          type: ["integer", "null"]
        sbuName:
          type: ["string", "null"]
        sbuCode:
          type: ["string", "null"]
        assetCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    LocationInput:
      type: object
      required: [name, type, building]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [office, gate, warehouse, meeting_room, lab, reception, server_room]
        building:
          type: string
        floor:
          type: string
        description:
          type: string
        sbuId:
          type: integer

    LocationUpdate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [office, gate, warehouse, meeting_room, lab, reception, server_room]
        building:
          type: string
        floor:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        sbuId:
          type: ["integer", "null"]

    # ── Movement schemas ─────────────────────────────────────────────────────
    MovementEvent:
      type: object
      required: [id, assetId, assetName, triggeredBy, timestamp]
      properties:
        id:
          type: integer
        assetId:
          type: integer
        assetName:
          type: string
        rfidTag:
          type: string
        fromLocationId:
          type: ["integer", "null"]
        fromLocationName:
          type: ["string", "null"]
        toLocationId:
          type: ["integer", "null"]
        toLocationName:
          type: ["string", "null"]
        sbuId:
          type: ["integer", "null"]
        sbuName:
          type: ["string", "null"]
        triggeredBy:
          type: string
          enum: [rfid, manual, gate_pass]
        rfidReaderId:
          type: ["integer", "null"]
        movedBy:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        timestamp:
          type: string
          format: date-time

    MovementInput:
      type: object
      required: [assetId, toLocationId]
      properties:
        assetId:
          type: integer
        toLocationId:
          type: integer
        movedBy:
          type: string
        notes:
          type: string

    # ── Gate Pass schemas ────────────────────────────────────────────────────
    GatePass:
      type: object
      required: [id, assetId, assetName, requestedBy, status, reason, createdAt]
      properties:
        id:
          type: integer
        assetId:
          type: integer
        assetName:
          type: string
        rfidTag:
          type: string
        sbuId:
          type: ["integer", "null"]
        sbuName:
          type: ["string", "null"]
        requestedBy:
          type: string
        approvedBy:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        reason:
          type: string
        destination:
          type: ["string", "null"]
        returnDate:
          type: ["string", "null"]
          format: date
        decisionNote:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GatePassInput:
      type: object
      required: [assetId, requestedBy, reason]
      properties:
        assetId:
          type: integer
        requestedBy:
          type: string
        reason:
          type: string
        destination:
          type: string
        returnDate:
          type: string
          format: date

    GatePassDecision:
      type: object
      required: [decidedBy]
      properties:
        decidedBy:
          type: string
        note:
          type: string

    # ── RFID schemas ─────────────────────────────────────────────────────────
    RFIDSimulateInput:
      type: object
      required: [rfidTag, readerId]
      properties:
        rfidTag:
          type: string
        readerId:
          type: integer

    RFIDReader:
      type: object
      required: [id, name, locationId, locationName, status]
      properties:
        id:
          type: integer
        name:
          type: string
        locationId:
          type: integer
        locationName:
          type: string
        sbuId:
          type: ["integer", "null"]
        sbuCode:
          type: ["string", "null"]
        sbuName:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        lastReadAt:
          type: ["string", "null"]
          format: date-time

    # ── Dashboard schemas ─────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalAssets, activeAssets, missingAssets, maintenanceAssets, pendingGatePasses, todayMovements, totalLocations, unacknowledgedInsights, sbuBreakdown]
      properties:
        totalAssets:
          type: integer
        activeAssets:
          type: integer
        missingAssets:
          type: integer
        maintenanceAssets:
          type: integer
        pendingGatePasses:
          type: integer
        todayMovements:
          type: integer
        totalLocations:
          type: integer
        unacknowledgedInsights:
          type: integer
        sbuBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/SBUBreakdown"

    SBUBreakdown:
      type: object
      required: [sbuId, sbuCode, sbuName, sbuColor, totalAssets, activeAssets, missingAssets]
      properties:
        sbuId:
          type: integer
        sbuCode:
          type: string
        sbuName:
          type: string
        sbuColor:
          type: string
        totalAssets:
          type: integer
        activeAssets:
          type: integer
        missingAssets:
          type: integer
        maintenanceAssets:
          type: integer

    ActivityItem:
      type: object
      required: [id, type, description, timestamp]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [movement, gate_pass_created, gate_pass_approved, gate_pass_rejected, asset_registered, rfid_scan, insight, lifecycle_event]
        description:
          type: string
        assetId:
          type: ["integer", "null"]
        assetName:
          type: ["string", "null"]
        sbuCode:
          type: ["string", "null"]
        severity:
          type: ["string", "null"]
          enum: [info, warning, critical, null]
        timestamp:
          type: string
          format: date-time

    LocationBreakdown:
      type: object
      required: [locationId, locationName, locationType, assetCount]
      properties:
        locationId:
          type: integer
        locationName:
          type: string
        locationType:
          type: string
        sbuCode:
          type: ["string", "null"]
        assetCount:
          type: integer

    GateActivityItem:
      type: object
      required: [readerId, readerName, locationName, sbuCode, sbuName, timestamp, assetName, rfidTag, direction]
      properties:
        readerId:
          type: integer
        readerName:
          type: string
        locationName:
          type: string
        sbuCode:
          type: string
        sbuName:
          type: string
        assetId:
          type: integer
        assetName:
          type: string
        rfidTag:
          type: string
        direction:
          type: string
          enum: [entry, exit, internal]
        timestamp:
          type: string
          format: date-time

    # ── AI Insight schemas ────────────────────────────────────────────────────
    AIInsight:
      type: object
      required: [id, type, message, severity, dismissed, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [anomaly, idle_asset, unauthorized_movement, missing_asset, maintenance_due, unusual_pattern]
        message:
          type: string
        assetId:
          type: ["integer", "null"]
        assetName:
          type: ["string", "null"]
        sbuCode:
          type: ["string", "null"]
        severity:
          type: string
          enum: [info, warning, critical]
        dismissed:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AIQueryInput:
      type: object
      required: [question]
      properties:
        question:
          type: string

    AIQueryResult:
      type: object
      required: [question, answer, timestamp]
      properties:
        question:
          type: string
        answer:
          type: string
        relatedAssets:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        timestamp:
          type: string
          format: date-time

    # ── BC Integration schemas ────────────────────────────────────────────────
    BCSyncStatus:
      type: object
      required: [connected, lastSyncAt, status, syncedAssets]
      properties:
        connected:
          type: boolean
        lastSyncAt:
          type: ["string", "null"]
          format: date-time
        status:
          type: string
          enum: [idle, syncing, success, error, not_configured]
        syncedAssets:
          type: integer
        errorMessage:
          type: ["string", "null"]
        nextSyncAt:
          type: ["string", "null"]
          format: date-time
