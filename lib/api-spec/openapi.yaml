        missingAssets:
          type: integer
        maintenanceAssets:
          type: integer
        pendingGatePasses:
          type: integer
        todayMovements:
          type: integer
        totalLocations:
          type: integer
        unacknowledgedInsights:
          type: integer
        sbuBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/SBUBreakdown"

    SBUBreakdown:
      type: object
      required: [sbuId, sbuCode, sbuName, sbuColor, totalAssets, activeAssets, missingAssets]
      properties:
        sbuId:
          type: integer
        sbuCode:
          type: string
        sbuName:
          type: string
        sbuColor:
          type: string
        totalAssets:
          type: integer
        activeAssets:
          type: integer
        missingAssets:
          type: integer
        maintenanceAssets:
          type: integer

    ActivityItem:
      type: object
      required: [id, type, description, timestamp]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [movement, gate_pass_created, gate_pass_approved, gate_pass_rejected, asset_registered, rfid_scan, insight, lifecycle_event]
        description:
          type: string
        assetId:
          type: ["integer", "null"]
        assetName:
          type: ["string", "null"]
        sbuCode:
          type: ["string", "null"]
        severity:
          type: ["string", "null"]
          enum: [info, warning, critical, null]
        timestamp:
          type: string
          format: date-time

    LocationBreakdown:
      type: object
      required: [locationId, locationName, locationType, assetCount]
      properties:
        locationId:
          type: integer
        locationName:
          type: string
        locationType:
          type: string
        sbuCode:
          type: ["string", "null"]
        assetCount:
          type: integer

    MovementTrendPoint:
      type: object
      required: [date, rfid, manual, gatePass, total]
      properties:
        date:
          type: string
          description: Calendar day (YYYY-MM-DD) in the organisation timezone
        rfid:
          type: integer
        manual:
          type: integer
        gatePass:
          type: integer
        total:
          type: integer

    GateActivityItem:
      type: object
      required: [readerId, readerName, locationName, sbuCode, sbuName, timestamp, assetName, rfidTag, direction]
      properties:
        readerId:
          type: integer
        readerName:
          type: string
        locationName:
          type: string
        sbuCode:
          type: string
        sbuName:
          type: string
        assetId:
          type: integer
        assetName:
          type: string
        rfidTag:
          type: string
        direction:
          type: string
          enum: [entry, exit, internal]
        timestamp:
          type: string
          format: date-time

    # ── AI Insight schemas ────────────────────────────────────────────────────
    AIInsight:
      type: object
      required: [id, type, message, severity, dismissed, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [anomaly, idle_asset, unauthorized_movement, missing_asset, maintenance_due, unusual_pattern]
        message:
          type: string
        assetId:
          type: ["integer", "null"]
        assetName:
          type: ["string", "null"]
        sbuCode:
          type: ["string", "null"]
        gatePassId:
          type: ["integer", "null"]
        severity:
          type: string
          enum: [info, warning, critical]
        dismissed:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AIQueryInput:
      type: object
      required: [question]
      properties:
        question:
          type: string

    AIQueryResult:
      type: object
      required: [question, answer, timestamp]
      properties:
        question:
          type: string
        answer:
          type: string
        relatedAssets:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        relatedGatePasses:
          type: array
          items:
            $ref: "#/components/schemas/GatePass"
        intent:
          type: string
          description: Intent the question was mapped to (e.g. locate_asset, not_moved, gate_passes)
        source:
          type: string
          enum: [rules, openai]
          description: Which parser understood the question (OpenAI when configured, rules as the fallback)
        timestamp:
          type: string
          format: date-time

    # ── BC Integration schemas ────────────────────────────────────────────────
    BCSyncStatus:
      type: object
      required: [connected, lastSyncAt, status, syncedAssets]
      properties:
        connected:
