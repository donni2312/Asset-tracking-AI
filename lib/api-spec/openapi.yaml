openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.3.0
  description: TSL AssetIQ — Intelligent Asset Management & Tracking System for TSL Limited, Zimbabwe
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sbus
    description: Strategic Business Unit management
  - name: assets
    description: Asset registry management
  - name: locations
    description: Location management
  - name: movements
    description: Asset movement events
  - name: lifecycle
    description: Asset lifecycle events (deployments, repairs, returns, transfers)
  - name: gate-passes
    description: Gate pass requests and approvals
  - name: rfid
    description: RFID reader registry and simulation
  - name: dashboard
    description: Dashboard summaries
  - name: insights
    description: AI-generated insights and anomaly detection
  - name: bc
    description: Business Central integration
  - name: auth
    description: Authentication and roles
  - name: reports
    description: CSV report downloads

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Authentication ───────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in and receive a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Unknown user, wrong password, or the account is disabled

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: The signed-in user behind the bearer token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing, expired or invalid token

  # ── SBUs ─────────────────────────────────────────────────────────────────────
  /sbus:
    get:
      operationId: listSbus
      tags: [sbus]
      summary: List all Strategic Business Units
      responses:
        "200":
          description: List of SBUs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SBU"
    post:
      operationId: createSbu
      tags: [sbus]
      summary: Create an SBU
      description: Requires the `operator` role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SBUInput"
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in without the `operator` role
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SBU"

  /sbus/{id}:
    get:
      operationId: getSbu
      tags: [sbus]
      summary: Get an SBU
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: SBU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SBU"
        "404":
          description: Not found
    patch:
      operationId: updateSbu
      tags: [sbus]
      summary: Update an SBU
      description: Requires the `operator` role.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SBUInput"
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in without the `operator` role
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SBU"

  /sbus/{id}/assets:
    get:
      operationId: getSbuAssets
      tags: [sbus]
      summary: Get all assets belonging to an SBU
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"

  # ── Assets ──────────────────────────────────────────────────────────────────
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List all assets
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, maintenance, retired, missing]
        - name: locationId
          in: query
          schema:
            type: ["integer", "null"]
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
        - name: category
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: Search query (name, serial, RFID tag)
          schema:
            type: string
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Register a new asset
      description: Requires the `operator` role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          description: Not signed in
        "403":
          description: The signed-in user may not register assets

  /assets/{id}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get asset details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Not found
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update asset
      description: >-
        Requires the `operator` role (operators and administrators may change
        every field).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          description: Not signed in
        "403":
          description: The signed-in user may not make this change
        "404":
          description: Not found
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Retire/decommission asset
      description: Requires the `operator` role.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Not signed in
        "403":
          description: The signed-in user may not delete assets

  /assets/{id}/history:
    get:
      operationId: getAssetHistory
      tags: [assets]
      summary: Full chronological history of an asset (movements + lifecycle events)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Full history timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetHistoryEvent"

  /assets/{id}/lifecycle:
    get:
      operationId: listAssetLifecycleEvents
      tags: [lifecycle]
      summary: List lifecycle events for an asset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lifecycle events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetLifecycleEvent"
    post:
      operationId: createAssetLifecycleEvent
      tags: [lifecycle]
      summary: Record a lifecycle event for an asset
      description: Requires the `operator` role.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetLifecycleEventInput"
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in without the `operator` role
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetLifecycleEvent"

  # ── Lifecycle (all events) ────────────────────────────────────────────────
  /lifecycle:
    get:
      operationId: listLifecycleEvents
      tags: [lifecycle]
      summary: List all lifecycle events (across all assets)
      parameters:
        - name: eventType
          in: query
          schema:
            type: string
            enum: [deployment, return_to_it, repair_sent, repair_returned, sbu_transfer, note]
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Lifecycle events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetLifecycleEvent"

  # ── Locations ───────────────────────────────────────────────────────────────
  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: List all locations
      parameters:
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
        - name: type
          in: query
          schema:
            type: string
            enum: [office, gate, warehouse, meeting_room, lab, reception, server_room]
      responses:
        "200":
          description: List of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
    post:
      operationId: createLocation
      tags: [locations]
      summary: Create a location
      description: Requires the `operator` role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in without the `operator` role
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"

  /locations/{id}:
    get:
      operationId: getLocation
      tags: [locations]
      summary: Get a location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
    patch:
      operationId: updateLocation
      tags: [locations]
      summary: Update a location
      description: Requires the `operator` role.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in without the `operator` role
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"

  /locations/{id}/assets:
    get:
      operationId: getLocationAssets
      tags: [locations]
      summary: Get assets currently at a location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assets at location
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"

  # ── Movements ────────────────────────────────────────────────────────────────
  /movements:
    get:
      operationId: listMovements
      tags: [movements]
      summary: List movement events
      parameters:
        - name: assetId
          in: query
          schema:
            type: ["integer", "null"]
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Movement events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MovementEvent"
    post:
      operationId: createMovement
      tags: [movements]
      summary: Record a manual movement event
      description: Requires the `viewer` role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovementInput"
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in without the `viewer` role
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementEvent"
        "400":
          description: Invalid input (e.g. asset is already at that location)
        "404":
          description: Asset or destination location not found

  /movements/{id}:
    get:
      operationId: getMovement
      tags: [movements]
      summary: Get a movement event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Movement event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementEvent"

  # ── Gate Passes ──────────────────────────────────────────────────────────────
  /gate-passes:
    get:
      operationId: listGatePasses
      tags: [gate-passes]
      summary: List gate pass requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Gate passes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GatePass"
    post:
      operationId: createGatePass
      tags: [gate-passes]
      summary: Submit a gate pass request
      description: Requires the `operator` role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatePassInput"
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in without the `operator` role
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatePass"
        "400":
          description: Invalid input (e.g. return date in the past)
        "404":
          description: Asset not found
        "409":
          description: The asset already has a pending gate pass

  /gate-passes/{id}:
    get:
      operationId: getGatePass
      tags: [gate-passes]
      summary: Get a gate pass
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Gate pass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatePass"

  /gate-passes/{id}/approve:
    post:
      operationId: approveGatePass
      tags: [gate-passes]
      summary: Approve a gate pass
      security:
        - bearerAuth: []
      description: Approving records a `gate_pass` movement (the asset leaves the premises) and resolves the related unauthorised-movement alert.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatePassDecision"
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in without the `operator` role
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatePass"
        "404":
          description: Gate pass not found
        "409":
          description: Gate pass has already been decided

  /gate-passes/{id}/reject:
    post:
      operationId: rejectGatePass
      tags: [gate-passes]
      summary: Reject a gate pass
      security:
        - bearerAuth: []
      description: Rejecting flags the asset (unauthorised-movement alert plus an audit note in the asset history).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatePassDecision"
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in without the `operator` role
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatePass"
        "404":
          description: Gate pass not found
        "409":
          description: Gate pass has already been decided

  # ── RFID Simulation ──────────────────────────────────────────────────────────
  /rfid/simulate:
    post:
      operationId: simulateRfidRead
      tags: [rfid]
      summary: Simulate an RFID tag read event at a gate or office reader
      security:
        - bearerAuth: []
      description: |
        Processes a tag read exactly like a hardware event would be processed:
        records an `rfid` movement, runs the gate-pass check for gate readers
        (an exit without an approved pass auto-creates a pending gate pass) and
        evaluates the anomaly rules (unauthorised exit, SBU location mismatch,
        out-of-hours scan).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RFIDSimulateInput"
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in without the `admin` role
        "200":
          description: Scan result (movement, gate check outcome and any insights raised)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFIDScanResult"
        "404":
          description: Unknown RFID tag or reader
        "409":
          description: Reader is inactive

  /rfid/readers:
    get:
      operationId: listRfidReaders
      tags: [rfid]
      summary: List all RFID readers (with SBU and location context)
      parameters:
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: RFID readers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RFIDReader"

  # ── Dashboard ─────────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary statistics (overall + per-SBU)
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/location-breakdown:
    get:
      operationId: getLocationBreakdown
      tags: [dashboard]
      summary: Asset counts grouped by location (optionally filtered by SBU)
      parameters:
        - name: sbuId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Location breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocationBreakdown"

  /dashboard/movement-trend:
    get:
      operationId: getMovementTrend
      tags: [dashboard]
      summary: Daily movement counts by trigger type for the last N days (organisation timezone)
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 14
      responses:
        "200":
          description: One point per day, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MovementTrendPoint"

  /dashboard/gate-activity:
    get:
      operationId: getGateActivity
      tags: [dashboard]
      summary: Recent gate scan events grouped by SBU gate
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Gate activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GateActivityItem"

  # ── AI Insights ───────────────────────────────────────────────────────────────
  /insights:
    get:
      operationId: listInsights
      tags: [insights]
      summary: List AI-generated insights and anomaly alerts
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AIInsight"

  /insights/{id}/dismiss:
    post:
      operationId: dismissInsight
      tags: [insights]
      summary: Dismiss an insight
      description: Requires the `operator` role.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in without the `operator` role
        "200":
          description: Dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIInsight"

  /ai/query:
    post:
      operationId: aiQuery
      tags: [insights]
      summary: Natural language query about assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIQueryInput"
      responses:
        "200":
          description: Query result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIQueryResult"

  # ── Reports (CSV downloads) ───────────────────────────────────────────────────
  # Times are in the organisation time zone (named in the column header). UTF-8 with a byte-order mark;
  # text cells starting with = + - @ are prefixed with ' so spreadsheets never run them as formulas.
  /reports/assets.csv:
    get:
      operationId: downloadAssetsReport
      tags: [reports]
      summary: Asset register as CSV (same filters as listAssets)
      description: Requires the `viewer` role.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, maintenance, retired, missing]
        - name: locationId
          in: query
          schema:
            type: integer
        - name: sbuId
          in: query
          schema:
            type: integer
        - name: category
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: CSV file (Content-Disposition attachment)
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Not signed in

  /reports/movements.csv:
    get:
      operationId: downloadMovementsReport
      tags: [reports]
      summary: Movement log as CSV, oldest first
      description: Requires the `viewer` role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
        - name: assetId
          in: query
          schema:
            type: integer
        - name: sbuId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: CSV file (Content-Disposition attachment)
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Invalid date range
        "401":
          description: Not signed in

  /reports/gate-passes.csv:
    get:
      operationId: downloadGatePassesReport
      tags: [reports]
      summary: Gate passes requested in a period as CSV, newest first
      description: Requires the `viewer` role.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: sbuId
          in: query
          schema:
            type: integer
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
      responses:
        "200":
          description: CSV file (Content-Disposition attachment)
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Invalid date range
        "401":
          description: Not signed in

  /reports/insights.csv:
    get:
      operationId: downloadInsightsReport
      tags: [reports]
      summary: AI alerts as CSV, newest first
      description: Requires the `viewer` role.
      security:
        - bearerAuth: []
      parameters:
        - name: includeDismissed
          in: query
          description: false = open alerts only (default true)
          schema:
            type: boolean
      responses:
        "200":
          description: CSV file (Content-Disposition attachment)
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Not signed in

  /reports/lifecycle.csv:
    get:
      operationId: downloadLifecycleReport
      tags: [reports]
      summary: Lifecycle events in a period as CSV, oldest first
      description: Requires the `viewer` role.
      security:
        - bearerAuth: []
      parameters:
        - name: eventType
          in: query
          schema:
            type: string
            enum: [deployment, return_to_it, repair_sent, repair_returned, sbu_transfer, note]
        - name: sbuId
          in: query
          schema:
            type: integer
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
      responses:
        "200":
          description: CSV file (Content-Disposition attachment)
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Invalid date range
        "401":
          description: Not signed in

  # ── Business Central ──────────────────────────────────────────────────────────
  /bc/sync-status:
    get:
      operationId: getBcSyncStatus
      tags: [bc]
      summary: Get Business Central sync status
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BCSyncStatus"

  /bc/sync:
    post:
      operationId: triggerBcSync
      tags: [bc]
      summary: Trigger a sync with Business Central
      description: Requires the `admin` role.
      security:
        - bearerAuth: []
      responses:
        "401":
          description: Not signed in
        "403":
          description: Signed in without the `admin` role
        "200":
          description: Sync triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BCSyncStatus"

components:
  parameters:
    ReportFrom:
      name: from
      in: query
      description: First calendar day (YYYY-MM-DD, organisation time zone), inclusive
      schema:
        type: string
        format: date
    ReportTo:
      name: to
      in: query
      description: Last calendar day (YYYY-MM-DD, organisation time zone), inclusive
      schema:
        type: string
        format: date

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token returned by POST /auth/login.

  schemas:
    # ── Auth schemas ─────────────────────────────────────────────────────────
    UserRole:
      type: string
      enum: [viewer, operator, admin]
      description: >-
        viewer = read everything and record asset movements; operator = every
        change except the RFID simulator and the Business Central sync; admin =
        everything.

    User:
      type: object
      required: [id, username, name, role]
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
          description: Display name, recorded on approvals and movements
        role:
          $ref: "#/components/schemas/UserRole"
        lastLoginAt:
          type: ["string", "null"]
          format: date-time

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    LoginResult:
      type: object
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
          description: Bearer token for the Authorization header
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── SBU schemas ──────────────────────────────────────────────────────────
    SBU:
      type: object
      required: [id, code, name, color, createdAt]
      properties:
        id:
          type: integer
        code:
          type: string
          description: Short code e.g. TSAS, BAK, AGRI, PROP, TSF
        name:
          type: string
          description: Full SBU name
        description:
          type: ["string", "null"]
        headOffice:
          type: ["string", "null"]
        color:
          type: string
          description: Hex colour for UI badges
        assetCount:
          type: integer
        locationCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    SBUInput:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        headOffice:
          type: string
        color:
          type: string

    # ── Asset schemas ────────────────────────────────────────────────────────
    Asset:
      type: object
      required: [id, name, category, serialNumber, rfidTag, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
          description: Laptop | Desktop | Projector | Phone | Printer | Network Equipment | UPS | Furniture | Vehicle | Other
        serialNumber:
          type: string
        rfidTag:
          type: string
        status:
          type: string
          enum: [active, maintenance, retired, missing]
        assignedTo:
          type: ["string", "null"]
        currentLocationId:
          type: ["integer", "null"]
        currentLocationName:
          type: ["string", "null"]
        sbuId:
          type: ["integer", "null"]
        sbuName:
          type: ["string", "null"]
        sbuCode:
          type: ["string", "null"]
        purchaseDate:
          type: ["string", "null"]
          format: date
        purchaseValue:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AssetInput:
      type: object
      required: [name, category, serialNumber, rfidTag]
      properties:
        name:
          type: string
        category:
          type: string
        serialNumber:
          type: string
        rfidTag:
          type: string
        status:
          type: string
          enum: [active, maintenance, retired, missing]
          default: active
        assignedTo:
          type: string
        currentLocationId:
          type: integer
        sbuId:
          type: integer
        purchaseDate:
          type: string
          format: date
        purchaseValue:
          type: number
        notes:
          type: string

    AssetUpdate:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [active, maintenance, retired, missing]
        assignedTo:
          type: ["string", "null"]
        currentLocationId:
          type: ["integer", "null"]
        sbuId:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]

    # ── Asset lifecycle schemas ───────────────────────────────────────────────
    AssetLifecycleEvent:
      type: object
      required: [id, assetId, assetName, eventType, performedBy, timestamp]
      properties:
        id:
          type: integer
        assetId:
          type: integer
        assetName:
          type: string
        rfidTag:
          type: string
        eventType:
          type: string
          enum: [deployment, return_to_it, repair_sent, repair_returned, sbu_transfer, note]
        performedBy:
          type: string
        fromSbuId:
          type: ["integer", "null"]
        fromSbuName:
          type: ["string", "null"]
        toSbuId:
          type: ["integer", "null"]
        toSbuName:
          type: ["string", "null"]
        assignedTo:
          type: ["string", "null"]
        vendor:
          type: ["string", "null"]
        ticketRef:
          type: ["string", "null"]
        conditionBefore:
          type: ["string", "null"]
        conditionAfter:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        timestamp:
          type: string
          format: date-time

    AssetLifecycleEventInput:
      type: object
      required: [eventType, performedBy]
      properties:
        eventType:
          type: string
          enum: [deployment, return_to_it, repair_sent, repair_returned, sbu_transfer, note]
        performedBy:
          type: string
        fromSbuId:
          type: integer
        toSbuId:
          type: integer
        assignedTo:
          type: string
        vendor:
          type: string
        ticketRef:
          type: string
        conditionBefore:
          type: string
        conditionAfter:
          type: string
        notes:
          type: string

    # ── Combined history event (movements + lifecycle) ───────────────────────
    AssetHistoryEvent:
      type: object
      required: [id, kind, timestamp]
      properties:
        id:
          type: string
          description: Prefixed identifier e.g. mov-12 or lc-7
        kind:
          type: string
          enum: [movement, lifecycle]
        timestamp:
          type: string
          format: date-time
        # movement fields
        fromLocationName:
          type: ["string", "null"]
        toLocationName:
          type: ["string", "null"]
        triggeredBy:
          type: ["string", "null"]
          enum: [rfid, manual, gate_pass, null]
        movedBy:
          type: ["string", "null"]
        gatePassId:
          type: ["integer", "null"]
        # lifecycle fields
        eventType:
          type: ["string", "null"]
          enum: [deployment, return_to_it, repair_sent, repair_returned, sbu_transfer, note, null]
        performedBy:
          type: ["string", "null"]
        fromSbuName:
          type: ["string", "null"]
        toSbuName:
          type: ["string", "null"]
        assignedTo:
          type: ["string", "null"]
        vendor:
          type: ["string", "null"]
        ticketRef:
          type: ["string", "null"]
        conditionBefore:
          type: ["string", "null"]
        conditionAfter:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    # ── Location schemas ─────────────────────────────────────────────────────
    Location:
      type: object
      required: [id, name, type, building, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [office, gate, warehouse, meeting_room, lab, reception, server_room]
        building:
          type: string
        floor:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        sbuId:
          type: ["integer", "null"]
        sbuName:
          type: ["string", "null"]
        sbuCode:
          type: ["string", "null"]
        assetCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    LocationInput:
      type: object
      required: [name, type, building]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [office, gate, warehouse, meeting_room, lab, reception, server_room]
        building:
          type: string
        floor:
          type: string
        description:
          type: string
        sbuId:
          type: integer

    LocationUpdate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [office, gate, warehouse, meeting_room, lab, reception, server_room]
        building:
          type: string
        floor:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        sbuId:
          type: ["integer", "null"]

    # ── Movement schemas ─────────────────────────────────────────────────────
    MovementEvent:
      type: object
      required: [id, assetId, assetName, triggeredBy, timestamp]
      properties:
        id:
          type: integer
        assetId:
          type: integer
        assetName:
          type: string
        rfidTag:
          type: string
        fromLocationId:
          type: ["integer", "null"]
        fromLocationName:
          type: ["string", "null"]
        toLocationId:
          type: ["integer", "null"]
        toLocationName:
          type: ["string", "null"]
        sbuId:
          type: ["integer", "null"]
        sbuName:
          type: ["string", "null"]
        triggeredBy:
          type: string
          enum: [rfid, manual, gate_pass]
        rfidReaderId:
          type: ["integer", "null"]
        gatePassId:
          type: ["integer", "null"]
          description: Gate pass that authorised (or was raised by) this movement
        movedBy:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        timestamp:
          type: string
          format: date-time

    MovementInput:
      type: object
      required: [assetId, toLocationId]
      properties:
        assetId:
          type: integer
        toLocationId:
          type: integer
        movedBy:
          type: string
        notes:
          type: string

    # ── Gate Pass schemas ────────────────────────────────────────────────────
    GatePass:
      type: object
      required: [id, assetId, assetName, requestedBy, status, reason, createdAt]
      properties:
        id:
          type: integer
        assetId:
          type: integer
        assetName:
          type: string
        rfidTag:
          type: string
        sbuId:
          type: ["integer", "null"]
        sbuName:
          type: ["string", "null"]
        requestedBy:
          type: string
        approvedBy:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        reason:
          type: string
        destination:
          type: ["string", "null"]
        returnDate:
          type: ["string", "null"]
          format: date
        decisionNote:
          type: ["string", "null"]
        source:
          type: string
          enum: [manual, rfid_gate]
          description: manual = requested in advance; rfid_gate = raised automatically by a gate reader
        gateLocationId:
          type: ["integer", "null"]
        gateLocationName:
          type: ["string", "null"]
        decidedAt:
          type: ["string", "null"]
          format: date-time
        exitedAt:
          type: ["string", "null"]
          format: date-time
          description: When the asset left the premises under this pass (latest gate_pass movement); null = not used yet
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GatePassInput:
      type: object
      required: [assetId, requestedBy, reason]
      properties:
        assetId:
          type: integer
        requestedBy:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        destination:
          type: string
        returnDate:
          type: string
          format: date

    GatePassDecision:
      type: object
      required: [decidedBy]
      properties:
        decidedBy:
          type: string
          minLength: 1
          description: Name of the approver taking the decision
        note:
          type: string

    # ── RFID schemas ─────────────────────────────────────────────────────────
    RFIDSimulateInput:
      type: object
      required: [rfidTag, readerId]
      properties:
        rfidTag:
          type: string
        readerId:
          type: integer
        scannedAt:
          type: string
          format: date-time
          description: Time the reader saw the tag (defaults to now). Lets the simulator replay out-of-hours scans.

    GateCheck:
      type: object
      required: [isGate, direction, outcome, authorized]
      properties:
        isGate:
          type: boolean
        direction:
          type: string
          enum: [entry, exit, internal]
          description: exit = asset was on the premises; entry = asset was off-premises (returning)
        outcome:
          type: string
          enum: [not_gate, entry, authorized, pending_created, pending_existing]
        authorized:
          type: boolean
        gatePass:
          $ref: "#/components/schemas/GatePass"

    RFIDScanResult:
      type: object
      required: [movement, gateCheck, insights]
      properties:
        movement:
          $ref: "#/components/schemas/MovementEvent"
        gateCheck:
          $ref: "#/components/schemas/GateCheck"
        insights:
          type: array
          description: Insights raised by this scan
          items:
            $ref: "#/components/schemas/AIInsight"

    RFIDReader:
      type: object
      required: [id, name, locationId, locationName, status]
      properties:
        id:
          type: integer
        name:
          type: string
        locationId:
          type: integer
        locationName:
          type: string
        sbuId:
          type: ["integer", "null"]
        sbuCode:
          type: ["string", "null"]
        sbuName:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        lastReadAt:
          type: ["string", "null"]
          format: date-time

    # ── Dashboard schemas ─────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalAssets, activeAssets, missingAssets, maintenanceAssets, pendingGatePasses, todayMovements, totalLocations, unacknowledgedInsights, sbuBreakdown]
      properties:
        totalAssets:
          type: integer
        activeAssets:
          type: integer
        missingAssets:
          type: integer
        maintenanceAssets:
          type: integer
        pendingGatePasses:
          type: integer
        todayMovements:
          type: integer
        totalLocations:
          type: integer
        unacknowledgedInsights:
          type: integer
        sbuBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/SBUBreakdown"

    SBUBreakdown:
      type: object
      required: [sbuId, sbuCode, sbuName, sbuColor, totalAssets, activeAssets, missingAssets]
      properties:
        sbuId:
          type: integer
        sbuCode:
          type: string
        sbuName:
          type: string
        sbuColor:
          type: string
        totalAssets:
          type: integer
        activeAssets:
          type: integer
        missingAssets:
          type: integer
        maintenanceAssets:
          type: integer

    ActivityItem:
      type: object
      required: [id, type, description, timestamp]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [movement, gate_pass_created, gate_pass_approved, gate_pass_rejected, asset_registered, rfid_scan, insight, lifecycle_event]
        description:
          type: string
        assetId:
          type: ["integer", "null"]
        assetName:
          type: ["string", "null"]
        sbuCode:
          type: ["string", "null"]
        severity:
          type: ["string", "null"]
          enum: [info, warning, critical, null]
        timestamp:
          type: string
          format: date-time

    LocationBreakdown:
      type: object
      required: [locationId, locationName, locationType, assetCount]
      properties:
        locationId:
          type: integer
        locationName:
          type: string
        locationType:
          type: string
        sbuCode:
          type: ["string", "null"]
        assetCount:
          type: integer

    MovementTrendPoint:
      type: object
      required: [date, rfid, manual, gatePass, total]
      properties:
        date:
          type: string
          description: Calendar day (YYYY-MM-DD) in the organisation timezone
        rfid:
          type: integer
        manual:
          type: integer
        gatePass:
          type: integer
        total:
          type: integer

    GateActivityItem:
      type: object
      required: [readerId, readerName, locationName, sbuCode, sbuName, timestamp, assetName, rfidTag, direction]
      properties:
        readerId:
          type: integer
        readerName:
          type: string
        locationName:
          type: string
        sbuCode:
          type: string
        sbuName:
          type: string
        assetId:
          type: integer
        assetName:
          type: string
        rfidTag:
          type: string
        direction:
          type: string
          enum: [entry, exit, internal]
        timestamp:
          type: string
          format: date-time

    # ── AI Insight schemas ────────────────────────────────────────────────────
    AIInsight:
      type: object
      required: [id, type, message, severity, dismissed, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [anomaly, idle_asset, unauthorized_movement, missing_asset, maintenance_due, unusual_pattern]
        message:
          type: string
        assetId:
          type: ["integer", "null"]
        assetName:
          type: ["string", "null"]
        sbuCode:
          type: ["string", "null"]
        gatePassId:
          type: ["integer", "null"]
        severity:
          type: string
          enum: [info, warning, critical]
        dismissed:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AIQueryInput:
      type: object
      required: [question]
      properties:
        question:
          type: string

    AIQueryResult:
      type: object
      required: [question, answer, timestamp]
      properties:
        question:
          type: string
        answer:
          type: string
        relatedAssets:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        relatedGatePasses:
          type: array
          items:
            $ref: "#/components/schemas/GatePass"
        intent:
          type: string
          description: Intent the question was mapped to (e.g. locate_asset, not_moved, gate_passes)
        source:
          type: string
          enum: [rules, openai]
          description: Which parser understood the question (OpenAI when configured, rules as the fallback)
        timestamp:
          type: string
          format: date-time

    # ── BC Integration schemas ────────────────────────────────────────────────
    BCSyncStatus:
      type: object
      required: [connected, lastSyncAt, status, syncedAssets]
      properties:
        connected:
          type: boolean
        lastSyncAt:
          type: ["string", "null"]
          format: date-time
        status:
          type: string
          enum: [idle, syncing, success, error, not_configured]
        syncedAssets:
          type: integer
        errorMessage:
          type: ["string", "null"]
        nextSyncAt:
          type: ["string", "null"]
          format: date-time
          description: Always null in the MVP (manual sync only)
        mode:
          type: string
          enum: [manual, automatic]
          description: MVP decision - manual sync only
        pendingChanges:
          type: integer
          description: Movements and gate-pass decisions recorded since the last successful sync
